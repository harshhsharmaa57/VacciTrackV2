<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="innerShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0d9488" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Shield Body -->
  <path d="M256 36 C342 88 412 95 448 104 C452 236 434 356 256 472 C78 356 60 236 64 104 C100 95 170 88 256 36 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#softGlow)" />

  <!-- Shield Top Glass Highlight -->
  <path d="M256 56 C332 102 396 109 428 116 C431 230 415 336 256 444 C97 336 81 230 84 116 C116 109 180 102 256 56 Z" 
        fill="url(#innerShine)" />

  <!-- Bold Healthcare Protection Cross -->
  <rect x="226" y="150" width="60" height="180" rx="18" fill="#ffffff" />
  <rect x="166" y="210" width="180" height="60" rx="18" fill="#ffffff" />

  <!-- Center Health Core Dot -->
  <circle cx="256" cy="240" r="18" fill="#0d9488" />
  <circle cx="256" cy="240" r="8" fill="#ffffff" />
</svg>
